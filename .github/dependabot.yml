version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    allow:
      - dependency-name: "*"
    groups:
      dev-dependencies:
        dependency-types: ["dev"]
      prod-dependencies:
        dependency-types: ["production"]
