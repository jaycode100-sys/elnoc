<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1a">
<title>ELNOC — Log in</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head><body>
<div class="login-wrap"><div class="login-card">
<div class="brand"><img class="brand-logo" src="/logo.png" alt="ELNOC logo"><div><div class="brand-name">ELNOC</div><div class="brand-sub">Engage and Learn NOC</div></div></div>
<h2>Log in.</h2>
<p class="muted">The command deck is behind this gate. Sessions last 12 hours, then re-auth.</p>
{% if error %}<p><span class="pill critical">{{ error }}</span></p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}">
<label>Username</label><input name="username" autofocus autocomplete="username"><br><br>
<label>Password</label><input name="password" type="password" autocomplete="current-password"><br><br>
<button type="submit" style="width:100%; justify-content:center">Log in →</button></form>
<p class="muted" style="font-size:13.5px">New here? <a href="/signup">Create an account</a> · <a href="/">← back to overview</a></p>
</div></div>
<div id="toast"></div>
</body></html>
