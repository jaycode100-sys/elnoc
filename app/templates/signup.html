<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1a">
<title>ELNOC — Create account</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head><body>
<div class="login-wrap"><div class="login-card">
<div class="brand"><img class="brand-logo" src="/logo.png" alt="ELNOC logo"><div><div class="brand-name">ELNOC</div><div class="brand-sub">Engage and Learn NOC</div></div></div>
<h2>Join the NOC.</h2>
<p class="muted">One account per engineer (FR-60). You land straight in the command deck.</p>
{% if error %}<p><span class="pill critical">{{ error }}</span></p>{% endif %}
<form method="post" action="/signup">
<input type="hidden" name="next" value="{{ next }}">
<label>Username (3–32 chars: letters, numbers, . _ -)</label><input name="username" value="{{ username or '' }}" autofocus autocomplete="username"><br><br>
<label>Display name</label><input name="name" value="{{ name or '' }}" autocomplete="name" placeholder="e.g. Night Engineer"><br><br>
<div class="formrow"><div><label>Password (8+ chars)</label><input name="password" type="password" autocomplete="new-password"></div>
<div><label>Repeat password</label><input name="password2" type="password" autocomplete="new-password"></div></div><br>
<button type="submit" style="width:100%; justify-content:center">Create account →</button></form>
<p class="muted" style="font-size:13.5px">Have one? <a href="/login">Log in</a> · <a href="/">← back to overview</a></p>
</div></div>
<div id="toast"></div>
</body></html>
