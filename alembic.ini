# Alembic configuration for ELNOC schema migrations
[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration files
timezone = utc

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_locations = %(here)s/versions

# the pattern to search for in version files
# version_path_source = %(here)s/versions

# the output encoding when alembic writes to stdout or a file
output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python functions to run on newly
# generated migration scripts.  See the documentation for further detail
# and examples

# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
