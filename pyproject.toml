[project]
name = "elnoc"
version = "0.1.0"
description = "ELNOC — Network Operations Center desktop app"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "Q", "S", "UP", "B", "C4", "DTZ", "EM", "FBT", "INT", "PLC", "PLE", "PLR", "PLW", "PMB", "PNE", "PRS", "RET", "RUF", "TRY", "W"]
ignore = [
    "E501",  # line too long (handled by format)
    "S101",  # assert (used in tests)
    "FBT001",  # boolean positional arg
    "FBT002",  # boolean default arg
    "PLR2004",  # magic values
    "TRY300",  # raise in try
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
magic-trailing-comma = "true"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
exclude = [
    "app/__pycache__",
    "build",
    "dist",
    "Output",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term --cov-fail-under=80"
markers = [
    "integration: integration tests",
    "security: security tests",
]
